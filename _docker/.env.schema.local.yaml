envSchema:
  # ---------------------------------------------------------------------------
  # Local-optimized schema (packaged as the "-local" variant).
  # The client port is published on the host; sensible localhost defaults keep
  # local deployment low-friction.
  # ---------------------------------------------------------------------------

  - name: IMAGE_BASE_PATH
    label: Image Registry Base Path
    description: "Base path of the container registry from which all Gaeco service images are pulled."
    type: text
    required: true
    default: ghcr.io/gaeco-ekkodale

  # ---------------------------------------------------------------------------
  # External Service Hostnames (local: localhost:port)
  # ---------------------------------------------------------------------------
  - name: GUIDELINE_SERVER_HOSTNAME
    label: Guideline Server Hostname
    description: "Hostname (and port) used to reach the Guideline service API. Step 1 (data model)."
    type: text
    required: false
    default: localhost:5008

  - name: ONTOLOGY_SERVER_HOSTNAME
    label: Ontology Server Hostname
    description: "Hostname (and port) used to reach the Ontology service API. Step 1 (data model)."
    type: text
    required: false
    default: localhost:5023

  - name: USECASE_SERVER_HOSTNAME
    label: UseCase Server Hostname
    description: "Hostname (and port) used to reach the UseCase service API. Step 2 (use cases)."
    type: text
    required: false
    default: localhost:5130

  - name: ACCESS_SERVER_HOSTNAME
    label: Access Server Hostname
    description: "Hostname (and port) used to reach the Access service API. Step 3 (permissions)."
    type: text
    required: false
    default: localhost:5131

  - name: INSTANCE_SERVER_HOSTNAME
    label: Instance Server Hostname
    description: "Hostname (and port) used to reach the Instance service API. Step 4 (data)."
    type: text
    required: false
    default: localhost:5024

  # ---------------------------------------------------------------------------
  # Homepage Client
  # ---------------------------------------------------------------------------
  - name: MOUNT_ROUTE
    label: Mount Route
    description: "URL path at which the Homepage micro-frontend is mounted. The shell additionally renders it as the start page at '/'."
    type: text
    required: true
    default: /homepage

  - name: PLATFORMCONFIG_ROUTE
    label: PlatformConfig Route
    description: "Route the 'data model' step links to. Must match the PlatformConfig module's mount route."
    type: text
    required: false
    default: /platform-config

  - name: USECASE_ROUTE
    label: UseCase Route
    description: "Route the 'use cases' step links to. Must match the UseCase module's mount route."
    type: text
    required: false
    default: /usecase

  - name: ACCESS_ROUTE
    label: Access Route
    description: "Route the 'permissions' step links to. Must match the Access module's mount route."
    type: text
    required: false
    default: /access

  - name: INSTANCE_ROUTE
    label: Instance Route
    description: "Route the 'data' step links to. Must match the Instance module's mount route."
    type: text
    required: false
    default: /instance

  - name: ENABLE_DEMO_DATA
    label: Enable Demo Data Hint
    description: "Shows how to load the demo portfolio. Local deployments only; hidden unless set to true."
    type: text
    required: false
    default: "true"

  - name: HOMEPAGE_CLIENT_OUTERPORT
    label: Homepage Client Host Port
    description: "Host port on which the Homepage client is published for local access."
    type: text
    required: true
    default: 3136
